[project]
name = "triage-ops"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Stenio Wagner", email = "stenio.wagner1@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "climage>=0.2.2",
    "ipython>=9.17.1",
    "langchain>=1.3.18",
    "langchain-anthropic>=1.7.1",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.11",
    "pydantic>=2.13.5",
    "pyfiglet>=1.0.4",
    "python-dotenv>=1.2.3",
]

[project.scripts]
assistant = "triage_ops:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.7",
]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "unit: fast tests for one module with dependencies isolated",
    "integration: tests covering collaboration between application modules",
    "evaluation: model-behavior evaluations that may be slower or nondeterministic",
    "slow: tests excluded from the normal fast feedback loop when requested",
]
