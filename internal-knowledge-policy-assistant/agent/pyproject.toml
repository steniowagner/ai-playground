[project]
name = "agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Stenio Wagner", email = "stenio.wagner1@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "groq>=1.6.0",
    "openai>=3.2.0",
    "pydantic>=2.13.4",
    "pypdf>=6.16.1",
    "sentence-transformers>=6.0.0",
    "torch>=2.13.0",
    "transformers>=5.15.1",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
agent = "agent:main"
cli = "agent.clients.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
