[project]
name = "agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Stenio Wagner", email = "stenio.wagner1@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "groq>=1.6.0",
    "openai>=3.2.0",
    "pypdf>=6.16.1",
    "transformers>=5.15.1",
]

[project.scripts]
agent = "agent:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
