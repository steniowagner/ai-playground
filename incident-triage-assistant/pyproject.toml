[project]
name = "incident-triage-assistant"
version = "0.1.0"
description = "A from-scratch, tool-using AI operations incident triage assistant"
readme = "README.md"
authors = [
    { name = "Stenio Wagner", email = "stenio.wagner1@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "groq>=1.6.0",
    "langchain>=1.3.18",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.3",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-xdist>=3.8.0",
]

[project.scripts]
assistant = "incident_triage_assistant:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
