[project]
name = "incident-triage-assistant-langchain"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Stenio Wagner", email = "stenio.wagner1@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "climage>=0.2.2",
    "ipython>=9.17.1",
    "langchain>=1.3.18",
    "langchain-anthropic>=1.7.1",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.11",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
]

[project.scripts]
assistant = "incident_triage_assistant_langchain:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
